services:
  postgres:
    image: postgres:17

    container_name: tt_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - datos_postgresql:/var/lib/postgresql/data

volumes:
  datos_postgresql:
