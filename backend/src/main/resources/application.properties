
# ========================================
# SISTEMA DE GESTION PARA MICROEMPRESAS
# ========================================

spring.application.name=gestion-microempresas

server.port=8080

# ========================================
# VARIABLES DE ENTORNO
# ========================================

spring.config.import=file:../.env[.properties]

# ========================================
# BASE DE DATOS POSTGRESQL
# ========================================

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ========================================
# JPA E HIBERNATE
# ========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ========================================
# MIGRACIONES FLYWAY
# ========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ========================================
# CODIFICACION
# ========================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# JWT y cookies de autenticacion
app.jwt.secreto=${JWT_SECRETO}
app.jwt.cookie-segura=${COOKIE_SEGURA:false}